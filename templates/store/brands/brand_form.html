{% extends 'base.html' %}
{% block navbar %}
  {% include 'partials/navbar.html' %}
{% endblock %}
{% block content %}
  <div class="wrapper wow fadeInLeft" data-wow-delay="0.1s">
    <h2 class="mt-3 text-center text-primary">{{ title }}</h2>
    <div class="p-3">
      <form action="{% url 'store:brand_create' %}"
            method="post"
            enctype="multipart/form-data">
        {% csrf_token %}
        <label for=""></label>
        <div class="form-field d-flex align-items-center">
          <span class="bi bi-plus-circle + bi bi-tag me-2 fs-5 text-muted disabled"></span>
          {{ form.name }}
        </div>
        <div class="d-flex justify-content-between align-items-center mt-5">
          <a class="btn btn-outline-secondary rounded-3 me-2"
             href="{% url 'store:home' %}">Thoát</a>
          <input class="btn btn-primary rounded-3" type="submit" value="{{ title }}" />
        </div>
      </form>
    </div>
  </div>
{% endblock %}
