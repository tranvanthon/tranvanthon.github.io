{% for config in customer_pages %}
     <div class="nav-link-custom {% if config.active %}active{% endif %}"

          hx-get="{{config.url}}"
          hx-select="#page-content"
          hx-target="#page-content"
          hx-swap="innerHTML"
          hx-push-url="true">
          <i class="{{ config.icon }}"></i> {{ config.title }}
     </div>
{% endfor %}
