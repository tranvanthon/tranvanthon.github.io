<!-- Wishlist -->
<section>
    {% if wishlist %}
        <h3 class="fw-bold mb-4">Sản phẩm yêu thích</h3>
        <div class="row g-4">
            <div class="col-md-3">
                <div class="card p-3 h-100">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=300"
                         class="product-img mb-3"
                         alt="Product" />
                    <h6 class="fw-bold">Đồng hồ SmartWatch</h6>
                    <p class="text-muted small">Thương hiệu: Samsung</p>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="fw-bold text-primary">2.450.000đ</span>
                        <button class="btn btn-sm btn-primary rounded-pill">Thêm giỏ</button>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 h-100">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=300"
                         class="product-img mb-3"
                         alt="Product" />
                    <h6 class="fw-bold">Tai nghe Bluetooth</h6>
                    <p class="text-muted small">Thương hiệu: Sony</p>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="fw-bold text-primary">1.200.000đ</span>
                        <button class="btn btn-sm btn-primary rounded-pill">Thêm giỏ</button>
                    </div>
                </div>
            </div>
        </div>
    {% else %}
        {% include "partials/dashboard/dashboard_404.html" %}
    {% endif %}
</section>
