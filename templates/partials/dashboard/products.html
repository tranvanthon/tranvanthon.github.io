<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">Quản lý sản phẩm</h3>
        <button class="btn btn-primary rounded-pill px-4"><i class="bi bi-plus-lg"></i> Thêm sản phẩm</button>
    </div>
    <div class="row g-4">
        {{ context_partial }}
        {% for cat in categories %}{{ cat }}{% endfor %}
        {% for product in products %}
            <div class="col-md-3">
                <div class="card p-3">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=300"
                         class="product-img mb-3"
                         alt="Product">
                    <h6 class="fw-bold">Đồng hồ SmartWatch</h6>
                    <p class="text-muted small">Điện tử • 120 trong kho</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-primary">2.450.000đ</span>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-outline-secondary border-0">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger border-0">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=300"
                         class="product-img mb-3"
                         alt="Product">
                    <h6 class="fw-bold">Tai nghe Bluetooth</h6>
                    <p class="text-muted small">Phụ kiện • 45 trong kho</p>
                    <span class="fw-bold text-primary">1.200.000đ</span>
                </div>
            </div>
        {% endfor %}
    </div>
</section>
