<div class="modal fade" id="editProfileModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Cập nhật thông tin</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form method="post" action="{% url 'edit_profile' %}" id="profileForm">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Họ tên</label>
                            <input type="text" class="form-control" name="name" value="{{ user.name }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Giới tính</label>
                            <select class="form-select" name="sex">
                                <option value="M" {% if user.profile.sex == 'M' %}selected{% endif %}>Nam</option>
                                <option value="F" {% if user.profile.sex == 'F' %}selected{% endif %}>Nữ</option>
                                <option value="O" {% if user.profile.sex == 'O' %}selected{% endif %}>Khác</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Số điện thoại</label>
                            <input type="tel"
                                   class="form-control"
                                   name="phone"
                                   value="{{ user.profile.phone|default:'' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Ngày sinh</label>
                            <input type="date"
                                   class="form-control"
                                   name="birthday"
                                   value="{{ user.profile.birthday|date:'Y-m-d'|default:'' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Địa chỉ</label>
                            <input type="text"
                                   class="form-control"
                                   name="address"
                                   value="{{ user.profile.address|default:'' }}">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn edit-btn text-white">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>
</div>
